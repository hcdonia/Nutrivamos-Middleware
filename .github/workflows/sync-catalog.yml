name: Sync Squarespace Catalog

# Runs every 6 hours and on manual trigger.
# Pulls the latest catalog from Squarespace, commits catalog.json if it changed,
# and pushes back to the repo. The Squarespace inject script auto-fetches the
# new catalog from raw.githubusercontent.com on the next page load.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}  # Adds a "Run workflow" button in the GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch catalog from Squarespace
        env:
          SQUARESPACE_API_KEY: ${{ secrets.SQUARESPACE_API_KEY }}
        run: node scripts/fetch-catalog.js

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet catalog.json; then
            echo "No catalog changes."
          else
            git add catalog.json
            git commit -m "chore: auto-sync catalog from Squarespace"
            git push
            echo "Catalog updated."
          fi

      # GitHub auto-disables a scheduled workflow after 60 days with no repo
      # activity. The catalog can go months without changing, so this heartbeat
      # makes one tiny commit if the repo hasn't been touched in ~50 days, which
      # keeps this workflow alive on its own. Fires at most once every ~50 days.
      - name: Keep workflow alive (heartbeat)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Days since last commit: $days"
          if [ "$days" -ge 50 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-activity
            git add .github/last-activity
            git commit -m "chore: workflow keepalive heartbeat [skip ci]"
            git push
            echo "Heartbeat committed."
          else
            echo "Repo is active; no heartbeat needed."
          fi
